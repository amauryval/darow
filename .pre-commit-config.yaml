repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-yaml
          - id: end-of-file-fixer
          - id: trailing-whitespace
          - id: mixed-line-ending

    - repo: https://github.com/pre-commit/mirrors-prettier
      rev: v3.1.0
      hooks:
          - id: prettier

    - repo: https://github.com/golangci/golangci-lint
      rev: v2.12.2
      hooks:
          - id: golangci-lint
            alias: golangci-lint-native
            name: golangci-lint (server, app)
            args: [--fast-only, ./internal/..., ./cmd/...]

    - repo: local
      hooks:
          - id: eslint-vue3
            name: eslint (app/vue3)
            entry: bash -c 'cd web && npx --no-install eslint . --ext .js,.vue,.ts --fix'
            language: system
            files: ^web/.*\.(js|ts|vue)$
            pass_filenames: false
