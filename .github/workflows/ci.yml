name: CI

on:
    push:
        branches: [main, develop]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.26.4'
            - run: go test -race $(go list ./... | grep -v /web/)
            - run: go test -race ./...
              working-directory: pkg/auth
