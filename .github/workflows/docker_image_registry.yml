name: Publish Docker image

on:
    push:
        tags:
            - '*'

jobs:
    publish-docker-image:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - name: Extract tag
              id: tag
              run: |
                  echo "value=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
                  echo "repo=$(echo ${{ github.event.repository.name }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

            - name: Login
              run: echo $CR_PAT | docker login ghcr.io -u amauryval --password-stdin
              env:
                  CR_PAT: ${{ secrets.CR_PAT }}

            # PLATFORM_TOKEN reads the platform's private repositories (MyAppLibs/go-pkg, web-platform).
            - name: Build
              env:
                  PLATFORM_TOKEN: ${{ secrets.PLATFORM_TOKEN }}
              run: |
                  COMMIT=$(git rev-parse --short HEAD)
                  BUILD_DATE=$(date -u -d "$(git log -1 --format=%cI)" +%Y-%m-%dT%H:%M:%SZ)
                  docker build . \
                    --secret id=github_token,env=PLATFORM_TOKEN \
                    --build-arg VERSION=${{ steps.tag.outputs.value }} \
                    --build-arg COMMIT=${COMMIT} \
                    --build-arg BUILD_DATE=${BUILD_DATE} \
                    --tag ghcr.io/amauryval/${{ steps.tag.outputs.repo }}:${{ steps.tag.outputs.value }}

            - name: Push
              run: |
                  docker push ghcr.io/amauryval/${{ steps.tag.outputs.repo }}:${{ steps.tag.outputs.value }}
