name: Publish Docker image

on:
    push:
        branches:
            - main
        tags:
            - '*'

jobs:
    publish-docker-image:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v2

            - name: Check tag
              run: |
                  git fetch --tags
                  if ! git tag --points-at HEAD | grep -q .; then
                    echo "No tag on current commit, aborting."
                    exit 1
                  fi

            - name: Extract tag
              id: tag
              run: |
                  echo "value=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
                  echo "repo=$(echo ${{ github.event.repository.name }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

            - name: Login
              run: echo $CR_PAT | docker login ghcr.io -u amauryval --password-stdin
              env:
                  CR_PAT: ${{ secrets.CR_PAT }}

            - name: Build
              run: |
                  docker build . --tag ghcr.io/amauryval/${{ steps.tag.outputs.repo }}:${{ steps.tag.outputs.value }}

            - name: Push
              run: |
                  docker push ghcr.io/amauryval/${{ steps.tag.outputs.repo }}:${{ steps.tag.outputs.value }}
