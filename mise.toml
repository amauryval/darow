[tools]
go = "1.26.4"
"go:github.com/swaggo/swag/cmd/swag" = "1.16.6"
golangci-lint = "2.12.2"
node = "26.3.1"
pre-commit = "4.6.0"

[env]
_.path = ["./bin"]
# Overrides a stale CGO_LDFLAGS exported by this machine's ~/.bashrc (points
# at a scratchpad from an unrelated project) that breaks cgo linking for
# the duckdb driver.
CGO_LDFLAGS = ""

[tasks.setup]
alias = "i"
run = """
pre-commit install
"""
sources = ["${APP_DIR}/package.json"]
description = "Install dependencies and git hooks"

# "./..." enumerates every package in the module tree, imported or not, so it
# picks up web/node_modules/flatted/golang/pkg/flatted — an npm-shipped Go
# package. It would be tested and vetted, never linked, but the go tool has no
# exclude flag, so every task below filters the package list explicitly.
[tasks.test]
description = "Run all Go tests"
run = "go test $(go list ./... | grep -v /web/)"

[tasks."test-race"]
description = "Run all Go tests with the race detector"
run = "go test -race $(go list ./... | grep -v /web/)"

[tasks.lint]
description = "Run go vet and gofmt checks"
run = """
go vet $(go list ./... | grep -v /web/)
gofmt -l cmd internal docs
"""

[tasks.docs]
description = "Regenerate Swagger docs (docs/docs.go) from handler annotations"
run = "swag init -g cmd/server/main.go -o docs"
sources = ["internal/router/**/*.go", "cmd/server/main.go"]
outputs = ["docs/docs.go", "docs/swagger.json", "docs/swagger.yaml"]

[tasks."ui-install"]
description = "Install web UI dependencies"
dir = "web"
run = "npm install"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks."ui-build"]
description = "Build the web UI into internal/webui/dist (embedded by go:embed)"
dir = "web"
depends = ["ui-install"]
run = "npm run build"

[tasks."ui-dev"]
description = "Run the web UI dev server (proxies /tables, /sources to :8080)"
dir = "web"
depends = ["ui-install"]
run = "npm run dev"

[tasks."ui-lint"]
description = "Run eslint on the web UI"
dir = "web"
depends = ["ui-install"]
run = "npm run lint"

[tasks."ui-test"]
description = "Run the web UI's vitest suite"
dir = "web"
depends = ["ui-install"]
run = "npm run test"

[tasks.build]
description = "Build the server binary"
depends = ["docs", "ui-build"]
run = "go build -o bin/server ./cmd/server"

# authdemo lets goauth's demo verifier answer every request — backend and,
# through /auth/session, the UI too — as an administrator without a token
# or provider contacted. The developer's own build tag, never carried by
# `mise run build` or the Dockerfile.
[tasks."run-dev"]
description = "Run the server against config.yaml"
depends = ["docs", "ui-build"]
run = "go run -tags authdemo ./cmd/server"
