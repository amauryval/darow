[env]
_.file = [".env", ".env.local"]
WEB_DIR = "web"
GO_PKGS = "./cmd/... ./internal/... ./docs ./web"
GOPRIVATE = "github.com/MyAppLibs/*,github.com/amauryval/*"
# The DuckDB driver links its C library: cgo on. A stale CGO_LDFLAGS of the shell would break it.
CGO_ENABLED = "1"
CGO_LDFLAGS = ""

[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
node = "26.3.1"
"go:github.com/swaggo/swag/cmd/swag" = "1.16.6"
"go:github.com/gzuidhof/tygo" = "0.2.21"

[tasks.setup]
alias = "i"
run = "cd ${WEB_DIR} && npm ci"
sources = ["web/package.json", "web/package-lock.json"]
outputs = ["web/node_modules/.package-lock.json"]
description = "Install the frontend dependencies"

# The local checkout of the platform's web library over the version web/package.json names, as go.work
# is for go-pkg. `npm ci` puts the named version back.
[tasks.sync-platform]
run = """
rsync -a --delete --exclude __tests__ ../MyAppLibs/web-platform/src ../MyAppLibs/web-platform/package.json \
  ${WEB_DIR}/node_modules/@myapplibs/web-platform/
"""
description = "Copy the platform's web library from its checkout into web/node_modules"

[tasks.lint]
run = """
golangci-lint run ${GO_PKGS} &&
cd ${WEB_DIR} && npm run lint
"""
description = "Lint Go and frontend"

[tasks.test-go]
depends = ["check-api-doc-generated"]
run = "go test ${GO_PKGS} -cover"
description = "Run Go tests with coverage"

[tasks.test-front]
run = "cd ${WEB_DIR} && npm run test:unit -- --passWithNoTests"
description = "Run frontend tests (Vitest)"

[tasks.test-all]
depends = ["test-go", "test-front"]
description = "Run all tests (Go, frontend)"

[tasks.generate-types]
run = """
tygo generate
cd ${WEB_DIR} && npx --no-install prettier --log-level warn --write src/*/api/*.gen.ts
"""
description = "Generate the TS types of web/src/darow/api from the Go packages tygo.yaml lists"

[tasks.build-frontend]
run = """
rm -rf ${WEB_DIR}/dist/assets ${WEB_DIR}/dist/index.html
cd ${WEB_DIR} && npm run build-only
"""
description = "Build the frontend into web/dist (embedded by go:embed)"

[tasks.generate-api-doc]
# The platform's document package comes first: swag resolves an embedded document.Meta[ID] only once
# it has parsed it.
run = """
platform=$(go list -m -f '{% raw %}{{.Dir}}{% endraw %}' github.com/MyAppLibs/go-pkg) &&
swag init --quiet --dir ./cmd/darow-api,$platform/document,$platform,./internal --generalInfo main.go --output docs \
  --outputTypes json --parseInternal &&
cd ${WEB_DIR} && npx --no-install prettier --log-level warn --write ../docs/swagger.json
"""
description = "Generate docs/swagger.json from the swag comments of the routes"

[tasks.check-api-doc-generated]
run = """
before=$(mktemp) && trap 'rm -f "$before"' EXIT &&
cp docs/swagger.json "$before" &&
mise run generate-api-doc &&
diff -u "$before" docs/swagger.json
"""
description = "Fail if docs/swagger.json is stale relative to the swag comments of the routes"

[tasks.build-app]
run = "go build -ldflags \"$(./scripts/ldflags.sh)\" -o bin/darow ./cmd/darow"
depends = ["build-frontend"]
description = "Build the executable (frontend embedded)"

[tasks.dev]
run = """
cd ${WEB_DIR} && npm run start-dev &
go run -ldflags "$(./scripts/ldflags.sh)" ./cmd/darow-api -workdir=./data
"""
description = "Run the frontend and API dev servers together"

[tasks.dev-app]
run = "go run -ldflags \"$(./scripts/ldflags.sh)\" ./cmd/darow -workdir=./data"
depends = ["build-frontend"]
description = "Build the frontend, then run the full app"

[tasks.dev-app-demo]
run = """
AUTH_PROVIDER= AUTH_ISSUER= AUTH_AUDIENCE= AUTH_REDIRECT_URL= AUTH_COOKIE_SECRET= \
  go run -tags authdemo -ldflags "$(./scripts/ldflags.sh)" ./cmd/darow -workdir=./data -auth-demo
"""
depends = ["build-frontend"]
description = "Run the full app with the simulated sign-in"
