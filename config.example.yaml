# config.example.yaml — the full reference: every field, at its default value.
#
# Copy it to config.yaml and keep only what you change: the file is optional and
# an absent field takes the value shown here. Order of application: defaults →
# file → GEOAPI_* environment variables → validation. An invalid value is a fatal
# error at startup, never a silent fallback.
#
# This file holds only what the process needs to start (before the settings table
# can even be read), plus the memory/availability guards and the auth block.
# Everything an operator retunes while serving — pagination limits, cache TTL,
# geometry bounds, the tile cache lifetime — lives in the settings table and is
# edited through PATCH /api/v1/settings. See spec/back/spec.md §2.

server:
    host: '0.0.0.0' # listen interface; 127.0.0.1 to accept loopback connections only
    port: 3000
    readTimeoutSec: 15
    writeTimeoutSec: 30
    idleTimeoutSec: 60
    shutdownTimeoutSec: 10 # how long in-flight requests are given on shutdown

duckdb:
    path: './data/geo.db' # the parent directory is created if missing
    maxOpenConns: 4
    maxSizeBytes: 0 # hard cap on the database's on-disk size, in bytes; 0 = unlimited

sources:
    workDir: './data/sources' # overridden by the --workdir flag
    maxSizeBytes: 104857600 # 100 MiB — largest source file that can be uploaded
    allowedExtensions: ['.geojson', '.shp', '.csv', '.gpkg', '.parquet'] # each starts with a dot

# Memory/availability guards, deliberately outside the settings table: a guard
# whose own limit is edited through the surface it guards is not a guard.
# Raising any of them costs a restart.
settings:
    maxBodyBytes: 10485760 # 10 MiB — cap on JSON bodies; the upload has its own (sources.maxSizeBytes)
    requestTimeoutSec: 30 # 0 = no per-request time limit
    cacheMaxItems: 1000 # shared by the metadata and schema LRU caches
    tileMaxItems: 5000

# Public reads, authorized writes (spec/back/spec.md §2.7, §6.7).
#
# Two questions, answered separately — being known is not being allowed:
#
#   1. AUTHENTICATION — who is calling?
#      mode: off    nobody is identified, nothing is refused. The default, and
#                   the mode a development run uses.
#      mode: proxy  an authenticating reverse proxy (tinyAuth, Authelia,
#                   oauth2-proxy, Traefik ForwardAuth, Caddy forward_auth…) puts
#                   the caller in the headers below. They are read ONLY when the
#                   request comes from trustedProxies, and stripped otherwise —
#                   a header is client-controlled, so without a trusted upstream
#                   anyone authenticates as anyone. No provider is named
#                   anywhere: changing gateway is a config edit, not a code one.
#
#   2. AUTHORIZATION — may this caller do this?
#      Every read is open to everyone, authenticated or not: listings, rows,
#      tiles, exports, the OGC collections, /healthz, /readyz, /diagnostics,
#      /swagger and the admin UI.
#      Every write — creating, editing or deleting a table, a row, a column, a
#      stored filter, a source, or changing the settings — requires a caller who
#      is BOTH authenticated (else 401 unauthorized) AND named by writeUsers or
#      writeGroups (else 403 forbidden). Being known is never being allowed: in
#      proxy mode one of the two lists must name somebody, or startup fails.
#
#      WHERE THE IDENTITIES COME FROM. Not from here — this server stores no
#      user and no password. The gateway owns the accounts (its own user list,
#      an OIDC provider, an LDAP directory) and puts the result in userHeader
#      and groupsHeader. This file only names, among those callers, the ones
#      allowed to write:
#
#        writeUsers  matched against userHeader   — the caller's own id
#        writeGroups matched against groupsHeader — any group they belong to
#
#      Use writeGroups when the gateway knows groups (OIDC groups claim, LDAP),
#      writeUsers when it does not — tinyauth's local accounts, for instance,
#      send no groups at all. A caller passing either list may write.
#      The names are the installation's own; nothing here is compiled in.
#
#      WHAT THE ADMIN UI SEES. GET /api/v1/session answers any caller with
#      what this block decided about them — enabled, authenticated, the id and
#      groups, canWrite, and the two URLs below. There is no sign-in screen in
#      the application: the gateway owns it, so loginUrl/logoutUrl are the only
#      way the UI can offer a link to it.
#
# See pkg/auth/README.md.
auth:
    mode: 'off'
    trustedProxies: [] # required in proxy mode: the gateway's IP or CIDR, e.g. ['10.0.0.0/8']
    userHeader: 'Remote-User' # the caller's identity; empty value = anonymous
    nameHeader: 'Remote-Name' # display name, optional
    groupsHeader: 'Remote-Groups' # comma-separated
    writeUsers: [] # ids allowed to write, e.g. ['alice', 'bob']
    writeGroups: [] # groups allowed to write, e.g. ['editors'] — one of the two lists is required in proxy mode
    loginUrl: '' # the gateway's sign-in page, e.g. 'https://auth.example.com/login?redirect_uri=https://darow.example.com/ui/'
    logoutUrl: '' # the gateway's sign-out page — both are served by GET /api/v1/session for the admin UI to link to
