# config.yaml — bootstrap-only parameters, needed to start the process itself
# (before the settings table can even be read). Everything else (row/list
# limits, cache TTLs and sizes...) is edited at runtime through the
# settings table — see spec/back/spec.md.
server:
    port: 8080
    readTimeoutSec: 15
    writeTimeoutSec: 30
    idleTimeoutSec: 60
    shutdownTimeoutSec: 10

duckdb:
    path: './data/geo.db'

sources:
    workDir: './data/sources'
    maxSizeBytes: 1048576000 # 1000 Mo
    allowedExtensions: ['.geojson', '.shp', '.csv', '.gpkg', '.parquet']
