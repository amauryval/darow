# config.yaml — bootstrap-only parameters, needed to start the process itself
# (before the settings table can even be read), plus the memory/availability
# guards TODO-17 moved out of the runtime-editable settings table (settings:
# below). Everything else (row/list limits, cache TTL, geometry bounds, the
# tile cache lifetime) is edited at runtime through the settings table —
# see spec/back/spec.md.
server:
    host: '0.0.0.0' # interface d'écoute ; 127.0.0.1 pour n'accepter que la loopback
    port: 3000
    readTimeoutSec: 15
    writeTimeoutSec: 30
    idleTimeoutSec: 60
    shutdownTimeoutSec: 10
    workDir: ./data

duckdb:
    path: './data/geo.db'
    maxSizeBytes: 1073741824 # max db size limit
    maxOpenConns: 20

sources:
    workDir: './data/sources'
    maxSizeBytes: 104857600 # 100 Mo — max file size to upload
    allowedExtensions: ['.geojson', '.shp', '.csv', '.gpkg', '.parquet']

settings:
    maxBodyBytes: 104857600  # 100 Mo — json limit body
    requestTimeoutSec: 30
    cacheMaxItems: 1000 # shared by the metadata and schema LRU caches
    tileMaxItems: 5000

# Authentication is not configured here at all: cmd/server resolves it entirely from a .env file
# (AUTH_PROVIDER, AUTH_ISSUER, AUTH_AUDIENCE, AUTH_REDIRECT_URL, AUTH_COOKIE_SECRET,
# AUTH_CLIENT_SECRET, ...) — see .env.example. No .env file present is demo mode: every visitor is
# authorized as an administrator and no token is checked at all.
