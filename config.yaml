# config.yaml — valeurs par défaut, surchargeables par variables d'environnement
# ou par argument de ligne de commande pour workDir (voir docs/spec.md 2.3).
server:
  port: 8080
  readTimeoutSec: 15
  writeTimeoutSec: 30
  idleTimeoutSec: 60
  shutdownTimeoutSec: 10

duckdb:
  path: "./data/geo.db"

sources:
  workDir: "./data/sources"
  maxSizeBytes: 1048576000 # 10000 Mo
  allowedExtensions: [".geojson", ".shp", ".csv", ".gpkg"]

api:
  defaultRowLimit: 100
  maxRowLimit: 1000
  maxBodyBytes: 1048576000 # 1000 Mo
  requestTimeoutSec: 30
  exportBatchSize: 1000

cache:
  metadataTTLSec: 300
  metadataMaxItems: 1000
  schemaTTLSec: 300
  schemaMaxItems: 1000
  tileTTLSec: 300
  tileMaxItems: 5000
